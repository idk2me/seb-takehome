version: '3.8'

services:
  demo:
    build:
      context: ./demo
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - demo
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
